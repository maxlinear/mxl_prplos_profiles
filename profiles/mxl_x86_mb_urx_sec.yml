  CONFIG_INTEL_X86_IMAGE_FORMAT_FIT=y
  CONFIG_INTEL_X86_IMAGE_FORMAT_MKIMAGE=y
  CONFIG_INTEL_X86_SINGLE_IMAGE=y
  CONFIG_INTEL_X86_MXL_SWU_IMAGE=y
