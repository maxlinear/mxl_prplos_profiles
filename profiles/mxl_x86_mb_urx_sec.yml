diffconfig: |
  CONFIG_DEVEL=y
  CONFIG_EXTRA_OPTIMIZATION="-fno-caller-saves -fno-plt -Wno-error=deprecated-declarations -Wno-error=address"
  CONFIG_KERNEL_GIT_CLONE_URI="https://github.com/maxlinear/linux.git"
  CONFIG_KERNEL_GIT_REF="UPDK_9.2.12"
  CONFIG_GPON_OMCI_ONU_UBUS_INTERFACE=y
  CONFIG_TARGET_MULTI_PROFILE=y
  CONFIG_TARGET_PER_DEVICE_ROOTFS=y
  CONFIG_TARGET_DEVICE_intel_x86_lgm_DEVICE_PRPL_MB_URX=y
  # CONFIG_TARGET_ROOTFS_EXT4FS is not set
  CONFIG_BUILD_LOG=y
  # CONFIG_PACKAGE_uboot-octopus-urx641-emmc-cust-img is not set
  # CONFIG_PACKAGE_uboot-octopus-urx641-emmc-field-img is not set
  # CONFIG_PACKAGE_uboot-octopus-urx641-emmc-manuboot-img is not set
  # CONFIG_PACKAGE_uboot-octopus-urx851-emmc-cust-img is not set
  # CONFIG_PACKAGE_uboot-octopus-urx851-emmc-field-img is not set
  # CONFIG_PACKAGE_uboot-octopus-urx851-emmc-manuboot-img is not set
  CONFIG_PACKAGE_uboot-octopus-urx641-sec-overlay-fit-p34x-phy-emmc-prpl=y
  CONFIG_PACKAGE_uboot-octopus-urx851-sec-overlay-fit-p34x-phy-emmc-prpl=y
  CONFIG_VERSION_FILENAMES=n
  CONFIG_VERSION_CODE_FILENAMES=n
  # CONFIG_PACKAGE_bios_images is not set
  CONFIG_BUILD_SDK="prplos"
  CONFIG_IMAGEOPT=y
  CONFIG_INTEL_X86_SECBOOT=y
  CONFIG_INTEL_X86_AIC_BASEADDR=0x010000000
  CONFIG_INTEL_X86_CERTIFICATION="/nfs/site/proj/chdsw_ci/telco/dist/Secureboot_Keys/LGM_Keys_Vault/Product/384-bit_certificate_product_a.bin"
  CONFIG_INTEL_X86_CERTIFICATION_SUPPORT=y
  CONFIG_INTEL_X86_DTB_ROLLBACKID=0x1
  CONFIG_INTEL_X86_ENC_KEY="ENCkey.bin"
  CONFIG_INTEL_X86_KERNEL_BASEADDR=0x8200000
  CONFIG_INTEL_X86_KERNEL_METADATA=y
  CONFIG_INTEL_X86_KERNEL_ROLLBACKID=0x1
  CONFIG_INTEL_X86_PRIVATE_KEY="/nfs/site/proj/chdsw_ci/telco/dist/Secureboot_Keys/LGM_Keys_Vault/Product/384-bit_keypair_product_a.der"
  CONFIG_INTEL_X86_PROD_UNIQUE_KEY="/nfs/site/proj/chdsw_ci/telco/dist/Secureboot_Keys/LGM_Keys_Vault/Product/256-bit_huk_product.bin"
  CONFIG_INTEL_X86_ROOTFS_ROLLBACKID=0x1
  CONFIG_INTEL_X86_SIGNTOOL="/nfs/site/proj/chdsw_ci/telco/dist/Secureboot_Keys/LGM_Tools/signtool"
  CONFIG_INTEL_X86_TEP_BASEADDR=0x8200000
  CONFIG_INTEL_X86_TEP_ROLLBACKID=0x1
  CONFIG_INTEL_X86_TEP_BASEADDR=0x8200000
  CONFIG_INTEL_X86_TEP_ROLLBACKID=0x1
  CONFIG_INTEL_X86_KERNEL_FLEXI_ROLLBACKID=0x1
  CONFIG_INTEL_X86_ROOTFS_FLEXI_ROLLBACKID=0x1
  # CONFIG_INTEL_X86_EXTERNAL_IMAGE_SIGNING=y
  # CONFIG_INTEL_X86_SIGNING_SER_USER=""
  # CONFIG_INTEL_X86_SIGNING_SER_PASS=""
  CONFIG_BUSYBOX_CUSTOM=y
  CONFIG_BUSYBOX_CONFIG_TFTPD=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_GET=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_PUT=y
  CONFIG_BUSYBOX_CONFIG_TFTP=y
  CONFIG_LGM_EIP123_SUPPORT=y
  CONFIG_PACKAGE_strongswan-charon=y
  CONFIG_PACKAGE_strongswan-default=y
  CONFIG_PACKAGE_strongswan-ipsec=y
  CONFIG_PACKAGE_strongswan-mod-aes=y
  CONFIG_PACKAGE_strongswan-mod-attr=y
  CONFIG_PACKAGE_strongswan-mod-connmark=y
  CONFIG_PACKAGE_strongswan-mod-constraints=y
  CONFIG_PACKAGE_strongswan-mod-des=y
  CONFIG_PACKAGE_strongswan-mod-dnskey=y
  CONFIG_PACKAGE_strongswan-mod-fips-prf=y
  CONFIG_PACKAGE_strongswan-mod-gmp=y
  CONFIG_PACKAGE_strongswan-mod-hmac=y
  CONFIG_PACKAGE_strongswan-mod-kdf=y
  CONFIG_PACKAGE_strongswan-mod-kernel-netlink=y
  CONFIG_PACKAGE_strongswan-mod-md5=y
  CONFIG_PACKAGE_strongswan-mod-mgf1=y
  CONFIG_PACKAGE_strongswan-mod-nonce=y
  CONFIG_PACKAGE_strongswan-mod-pem=y
  CONFIG_PACKAGE_strongswan-mod-pgp=y
  CONFIG_PACKAGE_strongswan-mod-pkcs1=y
  CONFIG_PACKAGE_strongswan-mod-pubkey=y
  CONFIG_PACKAGE_strongswan-mod-random=y
